[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling system"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=1.14.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "numpy<2",
    "tokenizers>=0.21.0",
    "pydantic>=2.13.5",
    "flake8>=7.3.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
